<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#0e1422"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a6e3a1"/>
      <stop offset="0.5" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>

  <text x="56" y="104" font-size="46" font-weight="800" fill="url(#title)">Tiny Agent Runtime</text>
  <text x="58" y="142" font-size="19" fill="#cdd6f4">A memory-safe AI agent runtime for the edge.</text>
  <text x="58" y="168" font-size="14" fill="#6b7280">Cloud brain. $5 chips as tools. It reasons in language, then acts — under a safety gate.</text>

  <!-- flow -->
  <g transform="translate(58,206)">
    <rect x="0" y="0" width="170" height="40" rx="10" fill="#15212e" stroke="#1f3a4d"/>
    <circle cx="22" cy="20" r="6" fill="#89b4fa"/>
    <text x="38" y="25" font-size="14" fill="#cdd6f4">Cloud LLM</text>

    <text x="186" y="25" font-size="18" fill="#6b7280">→</text>

    <rect x="206" y="0" width="220" height="40" rx="10" fill="#16241a" stroke="#2c4a30"/>
    <circle cx="228" cy="20" r="6" fill="#a6e3a1"/>
    <text x="244" y="25" font-size="14" fill="#cdd6f4">Agent Core · Rust</text>

    <text x="438" y="25" font-size="18" fill="#6b7280">→</text>

    <rect x="458" y="0" width="210" height="40" rx="10" fill="#241f12" stroke="#4d3f1f"/>
    <circle cx="480" cy="20" r="6" fill="#e6c384"/>
    <text x="496" y="25" font-size="14" fill="#cdd6f4">IoT tool-nodes</text>
  </g>

  <text x="760" y="231" font-size="12" fill="#45506a" letter-spacing="1.5">RUST · no_std · EDGE + IoT</text>
</svg>
