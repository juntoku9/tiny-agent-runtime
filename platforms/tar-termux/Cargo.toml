[package]
name = "tar-termux"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Android/Termux demo — agent loop drives the phone flashlight + Telegram, LLM over curl."

[[bin]]
name = "tar-termux"
path = "src/main.rs"

[dependencies]
tar-core = { workspace = true }
tar-proto = { workspace = true }
tar-hal = { workspace = true }
tar-llm = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "time"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
