[package]
name = "tar-termux"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Android/Termux demo — the agent loop drives the phone flashlight from its light sensor."

[[bin]]
name = "tar-termux"
path = "src/main.rs"

[dependencies]
tar-core = { workspace = true }
tar-proto = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "time"] }

# Optional cloud-LLM brain (pulls reqwest/TLS). Enable with `--features cloud`.
tar-llm = { workspace = true, optional = true }
tar-hal = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

[features]
default = []
cloud = ["dep:tar-llm", "dep:tar-hal", "dep:reqwest"]
